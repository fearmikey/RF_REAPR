## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Wed Jul 01 16:34:51 CDT 2026
android.useAndroidX=true
# KSP2 runs annotation processors in an isolated classloader. Required for Room 2.8's
# schema reader (AutoMigration), which clashes with the kotlinx-serialization bundled in
# the Kotlin compiler when run under KSP1.
ksp.useKSP2=true
# Lint only (does not affect compiled output): AGP 8.7.3 bundles lint 31.7.3, whose Kotlin
# Analysis API is older than the one the Compose 1.9 / Lifecycle 2.9 lint checks were built
# against, so their detectors crash with IncompatibleClassChangeError ("Found class
# ...KaSimpleVariableAccessCall, but interface was expected"). Run a newer lint instead of
# disabling the checks. Drop this once AGP itself is upgraded past this version.
android.experimental.lint.version=8.13.0
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\="-Xmx4096M" -XX\:MaxMetaspaceSize\=512m
